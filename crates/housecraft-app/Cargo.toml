[package]
name = "housecraft-app"
description = "HouseCraft desktop and web application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "housecraft-app"
path = "src/main.rs"

[dependencies]
housecraft-api.workspace = true
housecraft-draft.workspace = true
housecraft-io-native.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
