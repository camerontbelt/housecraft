[package]
name = "housecraft-app"
description = "HouseCraft desktop and web application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "housecraft-app"
path = "src/main.rs"

[dependencies]
image.workspace = true
housecraft-api.workspace = true
housecraft-draft.workspace = true
housecraft-io-native.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }

[dev-dependencies]
# Checks the 3D shader parses and validates without a GPU.
naga = { version = "30.0.1", features = ["wgsl-in"] }

# Installers and app bundles (cargo-packager). File associations here are what
# macOS uses (Info.plist); on Windows and Linux the app can also register itself.
[package.metadata.packager]
product-name = "HouseCraft"
identifier = "app.housecraft.desktop"
category = "GraphicsAndDesign"
description = "Residential design and construction documents"
formats = ["nsis", "app", "dmg", "deb", "appimage"]

[[package.metadata.packager.file-associations]]
name = "HouseCraft Plan"
description = "HouseCraft plan"
extensions = ["housecraft", "hcraft"]
mime-type = "application/x-housecraft"
role = "editor"
