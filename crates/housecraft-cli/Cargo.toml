[package]
name = "housecraft-cli"
description = "Headless HouseCraft command line: inspect, edit and serve documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "housecraft"
path = "src/main.rs"

[dependencies]
housecraft-api.workspace = true
housecraft-io-native.workspace = true
housecraft-mcp.workspace = true
housecraft-draft = { workspace = true, features = ["png"] }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
