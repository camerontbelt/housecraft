[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
housecraft-units = { path = "crates/housecraft-units" }
housecraft-model = { path = "crates/housecraft-model" }
housecraft-api = { path = "crates/housecraft-api" }
housecraft-io-native = { path = "crates/housecraft-io-native" }
housecraft-mcp = { path = "crates/housecraft-mcp" }

serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: lengths must survive save/load bit-for-bit.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
schemars = "1.2.3"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "io-std"] }

[profile.dev.package."*"]
opt-level = 1
